# Dex configuration for the OIDC experiment.
#
# Run with:   dex serve dex/config.yaml
# (see README.md for installing/running Dex via `go install` or Docker)
#
# Dex stands in for a real provider like Okta. The client and server only know
# the issuer URL and client id, so pointing them at Okta later is a config swap.

issuer: http://127.0.0.1:5556/dex

# In-memory storage: nothing persists across restarts, which is fine for an
# experiment (you just log in again).
storage:
  type: memory

web:
  http: 127.0.0.1:5556

# Token lifetimes. idTokens is deliberately short so the client's silent
# refresh path actually gets exercised. Access tokens share this expiry.
expiry:
  idTokens: "10m"
  refreshTokens:
    reuseInterval: "30s"
    validIfNotUsedFor: "2160h" # 90 days idle limit
    absoluteLifetime: "3960h"  # ~165 day hard cap

oauth2:
  responseTypes: ["code"]
  # Skip the "do you approve this app?" screen; the user still has to log in.
  skipApprovalScreen: true

# A single public (no-secret) client used by the CLI. Public + PKCE is the
# correct shape for a distributed binary. The same client is used for both the
# authorization-code and device flows.
staticClients:
  - id: oidc-experiment-cli
    name: 'OIDC Experiment CLI'
    public: true
    # No redirectURIs registered: Dex's public-client fallback then allows any
    # loopback redirect URI (any port, any path on 127.0.0.1/localhost) for the
    # auth-code flow, and auto-whitelists /device/callback for the device flow.
    # Registering even one URI switches Dex to strict exact-match mode, which
    # would break the kernel-assigned ephemeral port used by the client.
    redirectURIs: []

  # The resource server's identity. It never logs anyone in; it exists so the
  # access token can carry aud=oidc-experiment-api. The CLI requests that with
  # the scope "audience:server:client_id:oidc-experiment-api", which Dex honors
  # only because this client lists the CLI below as a trusted peer. The secret
  # is required for a non-public client but is never used (no flow runs here).
  - id: oidc-experiment-api
    name: 'OIDC Experiment API (resource server)'
    secret: unused-the-api-never-runs-a-flow
    redirectURIs: []
    trustedPeers:
      - oidc-experiment-cli
      # The automation client below is also trusted to request aud=...-api, so a
      # service account's client-credentials token is addressed to the server.
      - oidc-experiment-bot

  # A confidential (has-secret) client for machine-to-machine / "role" accounts:
  # automation that runs with no human and no browser, via --auth=client-credentials.
  # This is the registration *shape* a service account needs against a real
  # provider (Okta/Keycloak/Zitadel): a client id + secret (the human CLI above
  # is public + PKCE and ships no secret), trusted to request aud=...-api.
  #
  # IMPORTANT: mainline Dex does NOT implement the client_credentials grant (only
  # authorization_code / refresh_token / device_code / token-exchange), so against
  # *this* provider the flow returns "unsupported_grant_type". The client and this
  # registration are correct for a provider that supports the grant; Dex just
  # can't demo it. See DESIGN.md "Service / role accounts (machine-to-machine)".
  #
  # The secret is in-repo only because this is an experiment; in production it
  # lives in a vault / CI secret store, or is replaced by private_key_jwt or
  # workload identity federation (no stored secret at all) — see DESIGN.md.
  - id: oidc-experiment-bot
    name: 'OIDC Experiment Automation (service account)'
    secret: bot-secret-for-the-experiment-only
    redirectURIs: []

# A built-in username/password user so there's a "human" to log in as.
# Login as alice@example.com / password
enablePasswordDB: true
staticPasswords:
  - email: "alice@example.com"
    hash: '$2a$10$351Qx.P/23Bb5lXu2MwhB.7YhfDzf2OPIW3kZurT34OZODmmArYk.'
    username: "alice"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
